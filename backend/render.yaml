services:
  - type: web
    name: director-ai-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Everything below is `sync: false` — set in the Render dashboard so no
      # secret ever lands in the repo.
      - key: DATABASE_URL
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: GEMINI_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Object storage — any S3-compatible provider (R2 / Supabase / B2).
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: CORS_ORIGINS
        sync: false
